name: Nix validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Nix configuration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare flake lock file
        id: lock
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files --error-unmatch flake.lock >/dev/null 2>&1; then
            echo "generated=false" >> "${GITHUB_OUTPUT}"
            echo "Using the committed flake.lock."
          else
            nix flake lock
            echo "generated=true" >> "${GITHUB_OUTPUT}"
            echo "Generated flake.lock for download."
          fi

      - name: Upload generated flake lock
        if: steps.lock.outputs.generated == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: flake-lock
          path: flake.lock
          retention-days: 1
          if-no-files-found: error

      - name: Parse all Nix files
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            echo "Parsing ${file}"
            nix-instantiate --parse "${file}" >/dev/null
          done < <(find . -type f -name '*.nix' -print0)

      - name: Evaluate homelab configuration
        shell: bash
        run: |
          set -euo pipefail

          hostname="$(
            nix eval \
              .#nixosConfigurations.homelab.config.networking.hostName \
              --raw
          )"

          state_version="$(
            nix eval \
              .#nixosConfigurations.homelab.config.system.stateVersion \
              --raw
          )"

          homelab_enabled="$(
            nix eval \
              .#nixosConfigurations.homelab.config.homelab.enable
          )"

          garbage_collection_enabled="$(
            nix eval \
              .#nixosConfigurations.homelab.config.nix.gc.automatic
          )"

          test "${hostname}" = "homelab"
          test "${state_version}" = "26.05"
          test "${homelab_enabled}" = "true"
          test "${garbage_collection_enabled}" = "true"

          nix eval \
            .#nixosConfigurations.homelab.config.homelab.paths \
            --json >/dev/null

          nix eval \
            .#nixosConfigurations.homelab.config.systemd.tmpfiles.rules \
            --json >/dev/null

          nix eval \
            .#nixosConfigurations.homelab.config.environment.systemPackages \
            --apply builtins.length >/dev/null

          echo "Core NixOS configuration evaluated successfully."

      - name: Verify committed lock file remains unchanged
        if: steps.lock.outputs.generated == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- flake.lock
