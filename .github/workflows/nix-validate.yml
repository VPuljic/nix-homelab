name: Nix validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Nix configuration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse all Nix files
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            echo "Parsing ${file}"
            nix-instantiate --parse "${file}" >/dev/null
          done < <(find . -type f -name '*.nix' -print0)

      - name: Evaluate homelab configuration
        shell: bash
        run: |
          set -euo pipefail

          nix_eval() {
            nix eval --no-write-lock-file "$@"
          }

          hostname="$(
            nix_eval \
              .#nixosConfigurations.homelab.config.networking.hostName \
              --raw
          )"

          state_version="$(
            nix_eval \
              .#nixosConfigurations.homelab.config.system.stateVersion \
              --raw
          )"

          homelab_enabled="$(
            nix_eval \
              .#nixosConfigurations.homelab.config.homelab.enable
          )"

          garbage_collection_enabled="$(
            nix_eval \
              .#nixosConfigurations.homelab.config.nix.gc.automatic
          )"

          container_platform_enabled="$(
            nix_eval \
              .#nixosConfigurations.homelab.config.homelab.containers.enable
          )"

          podman_enabled="$(
            nix_eval \
              .#nixosConfigurations.homelab.config.virtualisation.podman.enable
          )"

          docker_enabled="$(
            nix_eval \
              .#nixosConfigurations.homelab.config.virtualisation.docker.enable
          )"

          oci_backend="$(
            nix_eval \
              .#nixosConfigurations.homelab.config.virtualisation.oci-containers.backend \
              --raw
          )"

          podman_prune_enabled="$(
            nix_eval \
              .#nixosConfigurations.homelab.config.virtualisation.podman.autoPrune.enable
          )"

          podman_dns_enabled="$(
            nix_eval \
              .#nixosConfigurations.homelab.config.virtualisation.podman.defaultNetwork.settings.dns_enabled
          )"

          service_framework_enabled="$(
            nix_eval \
              .#nixosConfigurations.homelab.config.homelab.services.enable
          )"

          homepage_requested="$(
            nix_eval \
              .#nixosConfigurations.homelab.config.homelab.services.homepage.enable
          )"

          homepage_service_enabled="$(
            nix_eval \
              .#nixosConfigurations.homelab.config.services.homepage-dashboard.enable
          )"

          test "${hostname}" = "homelab"
          test "${state_version}" = "26.05"
          test "${homelab_enabled}" = "true"
          test "${garbage_collection_enabled}" = "true"
          test "${container_platform_enabled}" = "true"
          test "${podman_enabled}" = "true"
          test "${docker_enabled}" = "false"
          test "${oci_backend}" = "podman"
          test "${podman_prune_enabled}" = "true"
          test "${podman_dns_enabled}" = "true"
          test "${service_framework_enabled}" = "true"
          test "${homepage_requested}" = "false"
          test "${homepage_service_enabled}" = "false"

          nix_eval \
            .#nixosConfigurations.homelab.config.homelab.paths \
            --json >/dev/null

          nix_eval \
            .#nixosConfigurations.homelab.config.systemd.tmpfiles.rules \
            --json >/dev/null

          nix_eval \
            .#nixosConfigurations.homelab.config.environment.systemPackages \
            --apply builtins.length >/dev/null

          echo "Core NixOS, Podman, and disabled service framework evaluated successfully."

      - name: Confirm validation did not modify the checkout
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files --error-unmatch flake.lock >/dev/null 2>&1; then
            git diff --exit-code -- flake.lock
          else
            test ! -e flake.lock
          fi

          git diff --exit-code
